<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<title>Auro Game Store - Gold Tarif</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  color:white;
  text-align:center;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
}

/* ===== THEMES ===== */
body.dark{
  background:
    linear-gradient(rgba(10,20,40,.85),rgba(8,18,37,.9)),
    radial-gradient(circle at top,#1a2c5b,#050a18);
}

body.red{
  background:
    linear-gradient(rgba(80,0,0,.85),rgba(30,0,0,.95)),
    radial-gradient(circle at top,#7a0000,#140000);
}

/* ===== HEADER ===== */
header{
  margin-top:20px;
}
header h1{color:#ffd700;margin-bottom:5px}

/* ===== BANNER ===== */
.banner{
  width:90%;
  max-width:400px;
  height:200px;
  margin:20px auto;
  border-radius:18px;
  background-image:url("banner.jpg"); /* <-- ЭНД ЗУРГИЙН НЭРИЙГ СОЛИНО */
  background-size:cover;
  background-position:center;
  position:relative;
  overflow:hidden;
  box-shadow:0 0 25px rgba(0,0,0,.6);
}

.banner::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(to top, rgba(0,0,0,.7), rgba(0,0,0,.1));
}

.banner-text{
  position:absolute;
  bottom:15px;
  left:15px;
  z-index:1;
  text-align:left;
}

.banner-text h2{
  margin:0;
  font-size:20px;
}

.banner-text p{
  margin:4px 0 0;
  font-size:13px;
  opacity:.9;
}

/* ===== CARD ===== */
.card{
  background:rgba(0,0,0,.55);
  margin:20px auto;
  padding:25px;
  width:90%;
  max-width:400px;
  border-radius:18px;
  box-shadow:0 0 25px rgba(255,0,0,.3);
  backdrop-filter:blur(6px);
}

/* ===== THEME BUTTON ===== */
.theme-btn{
  width:100%;
  margin-bottom:15px;
  padding:12px;
  border-radius:10px;
  border:none;
  cursor:pointer;
  background:#222;
  color:white;
  font-weight:bold;
}

/* ===== CONTROLS ===== */
select,button{
  margin:10px 0;
  padding:12px;
  border-radius:10px;
  border:none;
  font-size:16px;
  cursor:pointer;
}

button{
  background:#ff2a2a;
  color:white;
  font-weight:bold;
}

body.red button{background:#b00000}
button:active{opacity:.7}

/* ===== INFO ===== */
.info{
  margin-top:15px;
  background:rgba(255,255,255,.1);
  padding:15px;
  border-radius:12px;
}

/* ===== COPY ===== */
.copy{
  margin-top:8px;
  padding:10px;
  background:rgba(255,255,255,.18);
  border-radius:10px;
  cursor:pointer;
}
.copy:active{opacity:.6}

/* ===== TOAST ===== */
.toast{
  position:fixed;
  bottom:30px;
  background:#00c853;
  padding:12px 22px;
  border-radius:25px;
  font-weight:bold;
  opacity:0;
  transition:.4s;
}

/* ===== SNOW ===== */
.snowflake{
  position:fixed;
  top:-10px;
  pointer-events:none;
  animation:fall linear infinite;
}

@keyframes fall{
  to{transform:translateY(110vh)}
}

footer{
  margin:30px 0;
  font-size:13px;
  opacity:.8;
}

a{color:#00ffff}
</style>
</head>

</header>

<!-- ===== BANNER IMAGE ===== -->
<div class="banner">

<script>
/* ===== CLICK SOUND ===== */
const audioCtx=new (window.AudioContext||window.webkitAudioContext)();
function playClick(){
  const o=audioCtx.createOscillator();
  const g=audioCtx.createGain();
  o.type="square";
  o.frequency.value=800;
  g.gain.value=0.05;
  o.connect(g); g.connect(audioCtx.destination);
  o.start();
  o.stop(audioCtx.currentTime+0.05);
}

/* ===== THEME SWITCH ===== */
const body=document.body;
const themeBtn=document.querySelector(".theme-btn");
const savedTheme=localStorage.getItem("theme")||"dark";
body.classList.add(savedTheme);
themeBtn.innerText=savedTheme==="dark"?"🔴 RED MODE":"🌑 DARK MODE";

function toggleTheme(){
  playClick();
  if(body.classList.contains("dark")){
    body.classList.replace("dark","red");
    localStorage.setItem("theme","red");
    themeBtn.innerText="🌑 DARK MODE";
  }else{
    body.classList.replace("red","dark");
    localStorage.setItem("theme","dark");
    themeBtn.innerText="🔴 RED MODE";
  }
}
